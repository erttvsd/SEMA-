# تشغيل الإنتاج:  cp .env.example .env  ← عبّئ القيم  ←  docker compose up -d
# التهيئة الأولى:  docker compose run --rm sema npm run init -- --email you@example.ly --name "الاسم الكامل"
services:
  sema:
    build: .
    image: sema-alkhayr:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SEMA_DATA_DIR: /data
    volumes:
      - sema-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # خلف وكيل عكسي يتولى HTTPS — انظر docs/05

volumes:
  sema-data:
